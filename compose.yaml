# Flame-cn — Docker Compose / Podman Compose
#
# ─────────────────────────────────────────────────────────────
# 方式一（默认）：直接用已发布的镜像 —— 不需要源码，不需要构建
# ─────────────────────────────────────────────────────────────
#   1) 把本文件存成 compose.yaml（面板里直接粘贴即可）
#   2) 设置登录密码，三选一：
#        · 命令行：在项目目录放一个 .env 文件，写 FLAME_PASSWORD=你的密码
#        · 面板（Arcane/Portainer/Dockge）：在项目的环境变量 / Variables 里加 FLAME_PASSWORD
#        · 临时：FLAME_PASSWORD='你的密码' docker compose up -d
#   3) docker compose up -d
#   4) 打开 http://<服务器IP>:5005
#
#   镜像地址：ghcr.io/willfunniers/flame-cn（tag 见 README「Releases」）
#
# ─────────────────────────────────────────────────────────────
# 方式二：从源码本地构建（改了代码，或想完全离线自建）
# ─────────────────────────────────────────────────────────────
#   先 git clone 本仓库并 checkout 到目标 tag，然后把下面 image: 换成你喜欢的名字，
#   并取消 build: 两行的注释。
#
# ⚠️ 数据保存在 ${DATA_DIR}（默认 ./flame-data）：删容器、删镜像都不影响它，
#    **不要删这个目录**。里面是 config.json / db.sqlite / uploads / themes.json / .secret。
#   面板用户建议把 DATA_DIR 设成绝对路径，例如 /srv/flame-data。
# ⚠️ 密码与私钥永远不进 Git：请写进 .env（已在 .gitignore）或面板的变量设置里，
#    不要直接写在本文件里。

services:
  flame-cn:
    # 方式一：使用已发布的镜像（推荐，面板只需这一段）
    image: ghcr.io/willfunniers/flame-cn:${FLAME_VERSION:-v2.4.0-zh.3}

    # 方式二：从源码构建（取消注释，并把上面 image 换成你想用的名字）
    #build:
    #  context: .
    #  dockerfile: .docker/Dockerfile

    container_name: flame-cn
    restart: unless-stopped

    ports:
      - "${FLAME_PORT:-5005}:5005"

    environment:
      # 登录密码。请在 .env / 面板变量里设置 FLAME_PASSWORD。
      PASSWORD: ${FLAME_PASSWORD:-flame_password}

      # ---- 和风天气（可选，不配置就保持空值）----
      # 详见 README 的「QWeather」章节。凭据只走环境变量与只读挂载，不会下发浏览器。
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
      QWEATHER_AUTH_MODE: ${QWEATHER_AUTH_MODE:-}
      QWEATHER_KEY_ID: ${QWEATHER_KEY_ID:-}
      QWEATHER_DEVELOPER_ID: ${QWEATHER_DEVELOPER_ID:-}
      QWEATHER_PROJECT_ID: ${QWEATHER_PROJECT_ID:-}
      QWEATHER_PRIVATE_KEY_PATH: ${QWEATHER_PRIVATE_KEY_PATH:-}
      QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}

    volumes:
      # 数据目录：升级时保持不变
      - ${DATA_DIR:-./flame-data}:/app/data

      # 密钥目录（只读）。QWeather 私钥放这里；首次启动时该目录会被自动创建。
      # 默认 ./secrets 是相对本文件所在目录的。
      #   · 命令行用户：保持默认即可（把 PEM 放进 compose.yaml 旁边的 secrets/）
      #   · 面板用户：建议改成宿主机绝对路径，例如
      #       QWEATHER_SECRETS_DIR=/srv/flame-secrets
      #     这样私钥不必放进面板自己的项目目录。
      - ${QWEATHER_SECRETS_DIR:-./secrets}:/run/secrets:ro

      # 「Docker 集成」（自动发现容器）需要挂 Docker socket，默认关闭。
      # ⚠️ 开启等于把宿主机 Docker 的控制权交给这个容器，请自行评估风险。
      # - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5005/api/weather/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ──────────────────────────────────────────────────────────────
# QWeather（和风天气）配置 —— 可选，不配也能正常用
#
#   1) 在本机生成 Ed25519 密钥对：
#        mkdir -p ~/qweather && cd ~/qweather
#        openssl genpkey -algorithm ED25519 -out ed25519-private.pem
#        openssl pkey -pubout -in ed25519-private.pem > ed25519-public.pem
#        chmod 600 ed25519-private.pem
#        cat ed25519-public.pem        # 把这段公钥粘贴到和风天气控制台
#      控制台：项目管理 → 添加凭据 → 身份认证方式选 JSON Web Token
#
#   2) 把私钥放到密钥目录，并设置变量（.env 或面板变量里）：
#        命令行用户（默认 ./secrets）：
#          mkdir -p secrets && cp ~/qweather/ed25519-private.pem secrets/
#        面板用户（建议用宿主机绝对路径）：
#          mkdir -p /srv/flame-secrets
#          cp ~/qweather/ed25519-private.pem /srv/flame-secrets/
#          chmod 600 /srv/flame-secrets/ed25519-private.pem
#
#        变量（面板用户的 DATA_DIR / QWEATHER_SECRETS_DIR 写绝对路径）：
#          QWEATHER_SECRETS_DIR=/srv/flame-secrets
#          QWEATHER_API_HOST=你的专属APIHost
#          QWEATHER_AUTH_MODE=jwt
#          QWEATHER_KEY_ID=凭据ID
#          QWEATHER_DEVELOPER_ID=开发者ID
#          QWEATHER_PROJECT_ID=项目ID
#          QWEATHER_PRIVATE_KEY_PATH=/run/secrets/ed25519-private.pem
#
#   3) 重新部署，再到 Flame 界面：设置 → 天气 → 天气服务 = 和风天气 → 保存
#      状态显示「已配置」即成功。
#
#   只用 API Key 的话，把 QWEATHER_AUTH_MODE 设为 api-key 并填 QWEATHER_API_KEY 即可。
#   QWEATHER_API_HOST 必须是控制台给你的专属 Host；旧的公共地址会被直接拒绝
#   （状态显示「未配置」，不会静默回落）。
#
#   说明：Flame 沿用上游的 docker-secret 支持，会读取 /run/secrets 下的文件并放入
#   进程环境变量（以文件名大写为变量名）。日志里只会出现文件名，不会出现密钥内容。
#
#   完整图文步骤见 README 的「QWeather」章节。
# ──────────────────────────────────────────────────────────────
