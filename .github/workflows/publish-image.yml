name: Publish container image

# 打 tag（v*）时自动构建镜像并推送到 GitHub Container Registry：
#     ghcr.io/willfunniers/flame-cn:<tag>     例如 ghcr.io/willfunniers/flame-cn:v2.4.0-zh.3
#     ghcr.io/willfunniers/flame-cn:latest    （跟随最新的 v* tag）
#
# 也可以在 Actions 页面手动触发（workflow_dispatch），此时只会推出 :edge。
#
# 说明：
# - 使用仓库内**未修改**的 .docker/Dockerfile 构建，与本地 `docker build` 完全一致。
# - 构建过程中不注入任何凭据；镜像里不含 API Key / JWT / 私钥。
# - 当前只构建 linux/amd64。需要 arm64（树莓派等）时，把下面的 platforms 改成
#   linux/amd64,linux/arm64 即可（会启用 QEMU 模拟，构建时间明显变长）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: willfunniers/flame-cn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Flame-cn
            org.opencontainers.image.description=Chinese fork of Flame: zh-CN UI, independent wallpaper layer, server-side QWeather provider with Ed25519 JWT
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
