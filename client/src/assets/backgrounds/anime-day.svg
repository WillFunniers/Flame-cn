      <stop offset="0" stop-color="#ffe9f2"/>
      <stop offset=".42" stop-color="#f7f0ff"/>
      <stop offset="1" stop-color="#e7f3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e2" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#ffeacb" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffeacb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
